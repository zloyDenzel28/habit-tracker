[project]
name = "habit-tracker-backend"
version = "0.1.0"
description = "Трекер полезных привычек: api, worker, bot"
requires-python = ">=3.12"

# Версии по таблице в CLAUDE.md. Верхние границы стоят там, где смена
# мажора ломает API: aiogram 2.x, APScheduler 4.x, SQLAlchemy 2.1.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "apscheduler>=3.10,<4",
    "aiogram>=3.7,<4",
    # slim-образ не гарантирует базу IANA, а без неё zoneinfo уронит
    # расчёт local_date по User.timezone.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Ставятся в тот же образ: проект локальный, отдельная сборка под тесты
# сложнее, чем польза от неё. Запуск: docker compose exec api pytest
dev = [
    "pytest>=8.2,<9",
    # Тесты сервисного слоя, ходящие в Postgres, и тесты роутеров async def.
    "pytest-asyncio>=1.4,<2",
    # ASGI-транспорт для тестов роутеров без поднятого uvicorn.
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# auto: async def test_... не нужно размечать @pytest.mark.asyncio вручную.
# Фикстуры БД (db_session, client) — по одной на тест, той же дефолтной
# function-scope петли, что и сам тест: иначе asyncpg-соединение из одной
# петли пытаются использовать из другой, и это RuntimeError.
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
